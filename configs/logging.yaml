# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
version: 1
disable_existing_loggers: False

formatters:
  simple:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(process)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: "handpose_debug.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

root:
  level: INFO
  handlers: [console, file]

# Module stummschalten, die das Log in Production überfluten.
loggers:
  matplotlib:
    level: WARNING
  PIL:
    level: WARNING
  mediapipe:
    level: WARNING
  streamlit:
    level: WARNING
  uvicorn.access:
    level: WARNING
  asyncio:
    level: WARNING

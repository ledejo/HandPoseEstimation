# =============================================================================
# VAE (Variational Autoencoder) CONFIGURATION
# =============================================================================

# -----------------------------------------------------------------------------
# 1. HARDWARE
# -----------------------------------------------------------------------------
# Wird automatisch auf "cpu" gesetzt, falls CUDA nicht verfügbar ist.
device: "cuda"

# -----------------------------------------------------------------------------
# 2. PATHS
# -----------------------------------------------------------------------------
paths:
  features_training: "data/03_processed/features/training"
  features_production: "data/03_processed/features/production"
  model_save: "data/04_models/VAE"

# -----------------------------------------------------------------------------
# 3. DATA CONFIGURATION
# -----------------------------------------------------------------------------
# window_size 30 und 60 sind vortrainierte Modelle.
window_size: 30
stride: 5
validation_split: 0.2

# -----------------------------------------------------------------------------
# 4. MODEL ARCHITECTURE
# -----------------------------------------------------------------------------
hidden_dim: 256
latent_dim: 32
input_dim: 158
dropout: 0.075

# -----------------------------------------------------------------------------
# 5. TRAINING
# -----------------------------------------------------------------------------
batch_size: 32
epochs: 500
patience: 30
learning_rate: 1.6e-04
kl_weight: 1.6e-06

# -----------------------------------------------------------------------------
# 6. TUNING
# -----------------------------------------------------------------------------
n_trials: 30

# -----------------------------------------------------------------------------
# 7. INFERENCE
# -----------------------------------------------------------------------------
threshold: 0.01
